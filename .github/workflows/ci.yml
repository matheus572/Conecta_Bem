name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: conectabem_test
          MYSQL_USER: conectabem_test
          MYSQL_PASSWORD: conectabem_test_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Usados pelos testes (via tests/setup.js, que lê DB_TEST_*).
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_TEST_USER: conectabem_test
      DB_TEST_PASSWORD: conectabem_test_dev
      DB_TEST_NAME: conectabem_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test