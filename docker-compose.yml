services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_somente}
      MYSQL_DATABASE: ${DB_NAME:-conectabem}
      MYSQL_USER: ${DB_USER:-conectabem}
      MYSQL_PASSWORD: ${DB_PASSWORD:-conectabem_dev}
    ports:
      # Publica o MySQL em 3307 no host (a 3306 costuma estar ocupada por um
      # MySQL/MariaDB local). Internamente, o app continua usando a porta 3306.
      - "${DB_EXPOSE_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_dev_somente}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-test:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_somente}
      MYSQL_DATABASE: ${DB_TEST_NAME:-conectabem_test}
      MYSQL_USER: ${DB_TEST_USER:-conectabem_test}
      MYSQL_PASSWORD: ${DB_TEST_PASSWORD:-conectabem_test_dev}
    ports:
      - "${DB_TEST_EXPOSE_PORT:-3308}:3306"
    volumes:
      - db_test_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    command: sh -c "npm install && node migrations/migrate.js && node migrations/seed.js && npx nodemon -L src/server.js"
    environment:
      APP_PORT: ${APP_PORT:-3000}
      APP_ENV: ${APP_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:-troque-por-um-segredo-aleatorio}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-conectabem}
      DB_USER: ${DB_USER:-conectabem}
      DB_PASSWORD: ${DB_PASSWORD:-conectabem_dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  db_test_data: